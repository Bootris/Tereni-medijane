excerpt: "Kompletan vodič kroz pravne aspekte razvoda braka, podelu imovine i starateljstvo nad decom."
body: |
  # Razvod braka - šta treba da znate
  
  Razvod braka je složen pravni proces koji zahteva pažljivo razmatranje mnogih faktora. Naš tim vam pomaže da prođete kroz ovaj težak period sa minimum stresa.
  
  ## Vrste razvoda
  
  U Srbiji postoje dve osnovne vrste razvoda:
  - **Sporazumni razvod** - kada se supružnici slažu o svim aspektima
  - **Parnični razvod** - kada postoji neslaganje
  
  ## Podela imovine
  
  Zakon propisuje da se zajednička imovina deli na pola, osim ako su supružnici drugačije dogovorili. Ovo uključuje:
  - Nekretnine
  - Vozila
  - Štednje i investicije
  - Pokretnu imovinu
  
  ## Starateljstvo nad decom
  
  Interes deteta je uvek na prvom mestu. Sud razmatra:
  - Starost deteta
  - Vezanost za svakog roditelja
  - Uslove stanovanja
  - Finansijsku situaciju roditelja
  
  Kontaktirajte nas za besplatnu inicijalnu konsultaciju.
