body: |
  # Kupovina nekretnine - pravni vodič
  
  Kupovina nekretnine je jedna od najvažnijih investicija u životu. Zato je ključno da sve pravne aspekte obavite kako treba.
  
  ## Provera dokumentacije
  
  Pre kupovine nekretnine obavezno proverite:
  - **List nepokretnosti** - ko je vlasnik i da li postoje terete
  - **Urbanističku saglasnost** - da li je objekat legalno izgrađen
  - **Izvod iz katastra** - tačne površine i granice
  - **Rešenje o upotrebnoj dozvoli** - da li se objekat može koristiti
  
  ## Predugovor
  
  Predugovor je važan dokument koji:
  - Obavezuje obe strane na kupoprodaju
  - Definiše cenu i rokove
  - Štiti kupca od odustajanja prodavca
  - Reguliše kaparu
  
  ## Kupoprodajni ugovor
  
  Glavni ugovor mora biti:
  - Overen kod notara
  - Detaljno formulisan
  - Usklađen sa zemljišnim knjigama
  
  ## Upis u katastar
  
  Nakon kupovine, neophodno je:
  1. Podneti zahtev za upis u RGZ
  2. Platiti takse
  3. Dobiti novi list nepokretnosti
  
  Naš tim pruža kompletnu pravnu podršku kroz ceo proces kupovine.
