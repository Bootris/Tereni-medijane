body: |
  # Radna prava u 2025. godini
  
  Nova godina donosi značajne izmene u radnom zakonodavstvu koje direktno utiču na prava zaposlenih.
  
  ## Osnovna prava zaposlenih
  
  Svaki zaposleni u Republici Srbiji ima sledeća osnovna prava:
  - **Pravo na pravičnu zaradu** - minimalna zarada je usklađena sa inflacijom
  - **Pravo na bezbedan rad** - poslodavac mora obezbediti bezbedne uslove
  - **Pravo na godišnji odmor** - minimum 20 radnih dana
  - **Pravo na bolovanje** - plaćeno bolovanje po zakonu
  
  ## Nove izmene u 2025.
  
  Najznačajnije izmene su:
  1. Povećanje minimalne zarade za 12%
  2. Novi standardi za rad od kuće
  3. Dodatna zaštita za zaposlene roditelje
  4. Strože kazne za poslodavce koji krše prava
  
  ## Otkaz ugovora o radu
  
  Zakon jasno definiše kada je otkaz:
  - **Zakonit** - uz obrazloženje i poštovanje procedure
  - **Nezakonit** - zaposleni ima pravo na tužbu i naknadu
  
  ## Mobbing na radnom mestu
  
  Mobbing je zakonom zabranjen i uključuje:
  - Psihičko maltretiranje
  - Izolaciju zaposlenog
  - Nedozvoljeno ponižavanje
  - Uskraćivanje informacija potrebnih za rad
  
  Ako ste žrtva mobbinga, imate pravo na sudsku zaštitu.
  
  ## Kontaktirajte nas
  
  Naš tim pruža pravnu pomoć u svim aspektima radnog prava.
