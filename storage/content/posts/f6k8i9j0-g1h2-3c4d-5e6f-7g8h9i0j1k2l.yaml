title: "Nasledno pravo - kompletan vodič"
slug: "nasledno-pravo-kompletan-vodic"
excerpt: "Sve što trebate znati o nasleđivanju imovine, zakonskom i testamentalnom nasleđivanju, i procesima raspodele."
body: |
  # Nasledno pravo u Srbiji
  
  Nasledno pravo reguliše prenos imovine sa preminulog lica na njegove naslednike.
  
  ## Vrste nasleđivanja
  
  ### 1. Zakonsko nasleđivanje
  
  Kada nema testamenta, naslednici se određuju po zakonu:
  - **Prvi red**: deca i supružnik
  - **Drugi red**: roditelji, braća, sestre
  - **Treći red**: babe, dede
  - **Četvrti red**: ostali srodnici do četvrtog kolena
  
  ### 2. Testamentalno nasleđivanje
  
  Ostavilac može testamentom odrediti:
  - Ko će biti naslednik
  - Koliki će biti udeli
  - Posebne želje i uslove
  
  **Važno**: Nužni naslednici (deca, supružnik, roditelji) uvek imaju pravo na nužni deo.
  
  ## Proces nasleđivanja
  
  1. **Podnošenje zahteva** za pokretanje ostavinskog postupka
  2. **Utvrđivanje naslednika** - sud poziva sve potencijalne naslednike
  3. **Procena imovine** - određuje se vrednost ostavine
  4. **Podela** - naslednici dobijaju svoje delove
  5. **Upis u katastar** - prenos vlasništva
  
  ## Nužni deo
  
  Nužni naslednici imaju pravo na:
  - **1/2 zakonskog dela** ako su radnosp osobni
  - **Ceo zakonski deo** ako su neradnosposobni
  
  ## Testiranje ostavinskog sporazuma
  
  Naslednici mogu postići sporazum o podeli van suda, što:
  - Ubrzava postupak
  - Smanjuje troškove
  - Izbegava sporove
  
  ## Nedostojnost za nasleđivanje
  
  Lice može biti nedostojno ako je:
  - Ubilo ostavi oca
  - Teško zlostavljalo ostav ioca
  - Uskratilo pomoć u nuždi
  
  Kontaktirajte nas za pomoć u ostavinskim postupcima.
