title: "Dr Jovan Đorđević"
slug: "dr-jovan-djordjevic"
excerpt: "Specijalizovan za korporativno i poslovno pravo sa preko 20 godina iskustva u zastupanju domaćih i međunarodnih klijenata."
body: |
  Dr Jovan Đorđević je senior partner u našoj kancelariji sa bogatim iskustvom u korporativnom pravu. 
  
  Diplomirao je na Pravnom fakultetu Univerziteta u Beogradu, a doktorirao na temu međunarodnog poslovnog prava. 
  
  Tokom svoje karijere zastupao je neke od vodećih kompanija u regionu u složenim korporativnim transakcijama, 
  spajanjima i preuzimanjima, kao i u sporovima visokog profila.
  
  **Oblasti specijalizacije:**
  - Korporativno pravo
  - Poslovno pravo
  - Spajanja i preuzimanja
  - Ugovorno pravo
  - Međunarodno poslovno pravo
