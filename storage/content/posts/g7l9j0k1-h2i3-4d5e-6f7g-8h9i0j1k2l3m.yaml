body: |
  # Intelektualna svojina
  
  Zaštita intelektualne svojine je ključna za svaki biznis koji se bavi inovacijama.
  
  ## Vrste IP zaštite
  
  - **Patent** - zaštita izuma
  - **Žig** - zaštita brenda
  - **Dizajn** - zaštita izgleda proizvoda
  - **Autorsko pravo** - zaštita kreativnih dela
  
  Kontaktirajte nas za registraciju.
