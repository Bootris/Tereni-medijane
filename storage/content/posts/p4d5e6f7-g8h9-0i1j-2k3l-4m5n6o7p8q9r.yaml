title: "Ana Stojanović"
slug: "ana-stojanovic"
excerpt: "Mlada i dinamična advokatica specijalizovana za radno pravo i zastupanje zaposlenih u sporovima sa poslodavcima."
body: |
  Ana Stojanović je mladi advokat sa strašću za radnim pravom i zaštitom prava zaposlenih.
  
  Iako je relativno nova u profesiji, Ana već pokazuje izuzetne rezultate zahvaljujući 
  svom marljivom pristupu, temeljnom poznavanju zakona i posvećenosti klijentima.
  
  Ana je završila sa odličnim uspehom Pravni fakultet i odmah se pridružila našem timu 
  gde je specijalizovala radno pravo.
  
  **Oblasti specijalizacije:**
  - Radno pravo
  - Sporovi sa poslodavcima
  - Nezakoniti otkazi
  - Mobbing na radnom mestu
  - Zaštita prava zaposlenih
