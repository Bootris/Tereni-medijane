title: "Marija Petrović"
slug: "marija-petrovic"
excerpt: "Vodeći stručnjak za porodično pravo sa empatičnim pristupom i posvetenošću interesima klijenata i njihovih porodica."
body: |
  Marija Petrović je partner u našoj kancelariji specijalizovana za porodično pravo. 
  
  Sa over 15 godina prakse, Marija je pomogla stotinama klijenata kroz teške periode razvoda, 
  podele imovine i pitanja starateljstva nad decom.
  
  Njen pristup se odlikuje kombinacijom profesionalizma i empatije, uvek stavljajući interese 
  dece i porodice na prvo mesto.
  
  **Oblasti specijalizacije:**
  - Porodično pravo
  - Razvod braka
  - Starateljstvo nad decom
  - Podela imovine
  - Nasilje u porodici
