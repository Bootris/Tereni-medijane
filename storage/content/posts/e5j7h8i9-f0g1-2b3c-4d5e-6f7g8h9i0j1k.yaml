title: 'Vodič kroz krivičnu odbranu u pravu'
slug: vodic-kroz-krivicnu-odbranu-u-pravu
excerpt: 'Šta učiniti ako ste optuženi za krivično delo? Kompletna pravna pomoć i saveti od iskusnih advokata.'
body: "# Krivična odbrana - vaša prava\r\n\r\nAko ste optuženi za krivično delo, imate pravo na odbranu koje garantuje Ustav.\r\n\r\n## Osnovna prava optuženog\r\n\r\n- **Pravo na advokata** - možete izabrati svog advokata ili će vam biti dodeljen\r\n- **Pravo da ćutite** - niste obavezni da svedočite protiv sebe\r\n- **Pravo na tumača** - ako ne govorite jezik postupka\r\n- **Pravo na pravično suđenje** - u razumnom roku pred nezavisnim sudom\r\n\r\n## Faze krivičnog postupka\r\n\r\n1. **Istraga** - prikupljanje dokaza\r\n2. **Optužnica** - formalno podizanje optužbe\r\n3. **Glavni pretres** - javno suđenje\r\n4. **Presuda** - odluka suda\r\n5. **Žalba** - mogućnost osporavanja presude\r\n\r\n## Vrste krivičnih dela\r\n\r\nKrivična dela se dele na:\r\n- **Krivična dela protiv života i tela**\r\n- **Krivična dela protiv imovine**\r\n- **Privredni kriminal**\r\n- **Saobraćajni prekršaji sa krivičnim elementima**\r\n\r\n## Kada kontaktirati advokata\r\n\r\nOdmah nakon što:\r\n- Budete pozvani na informativni razgovor\r\n- Dobijete poziv za saslušanje\r\n- Budete uhapšeni\r\n- Saznate da ste osumnjičeni\r\n\r\n**Nikad ne idite sami!** Prisustvo advokata je ključno za vašu odbranu.\r\n\r\n## Naši rezultati\r\n\r\nNaš tim ima uspešnost od preko 85% u odbrani klijenata."
